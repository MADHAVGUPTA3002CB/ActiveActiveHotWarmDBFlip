[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flipbench"
version = "0.1.0"
description = "Correctness-first PostgreSQL/Debezium/Kafka hot-to-warm flip benchmark"
requires-python = ">=3.13,<3.14"
dependencies = [
  "confluent-kafka==2.11.1",
  "psycopg[binary]==3.2.9",
]

[project.scripts]
flipbench = "flipbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

